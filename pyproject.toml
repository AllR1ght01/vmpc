[project]
name = "vmpc"
version = "0.6"
description = "A terminal agent CLI: rich + prompt_toolkit, streaming, custom markdown renderer"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "prompt_toolkit>=3.0.40",
    "httpx>=0.27",
]

[project.scripts]
vmpc = "vmpc.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vmpc*"]
